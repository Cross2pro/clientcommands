// Simplified build.gradle without ForgeGradle (offline build)
// Uses pre-remapped Minecraft client and manual dependencies

plugins {
    id 'java'
}

apply plugin: 'maven-publish'

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}"

repositories {
    maven { url = uri("file:///home/hatch/workspace/local-repo") }
}

dependencies {
    // Pre-remapped Minecraft client (Mojang/official names)
    compileOnly files('/tmp/mc_files/client-official.jar')
    // Forge universal (Forge classes)
    compileOnly 'net.minecraftforge:forge:1.20.1-47.4.23:universal'
    // Mixin
    compileOnly 'org.spongepowered:mixin:0.8.5'
    annotationProcessor 'org.spongepowered:mixin:0.8.5'
    // SeedFinding
    implementation 'com.seedfinding:mc_feature:1.171.7'
    
    // Minecraft libraries needed for compile
    compileOnly 'com.mojang:logging:1.1.1'
    compileOnly 'com.mojang:brigadier:1.2.9'
    compileOnly 'com.mojang:datafixerupper:6.0.8'
    compileOnly 'com.google.code.gson:gson:2.10'
    compileOnly 'org.slf4j:slf4j-api:2.0.1'
    compileOnly 'org.apache.logging.log4j:log4j-api:2.19.0'
}

// Mixin refmap configuration
def mixinConfig = 'mixins.rngcommands.json'
def refmapName = 'mixins.rngcommands.refmap.json'

tasks.withType(JavaCompile).configureEach {
    options.annotationProcessorPath = configurations.annotationProcessor
    def refmapFile = file("$buildDir/resources/main/$refmapName")
    options.compilerArgs += [
        "-AoutRefMapFile=${refmapFile.canonicalPath}",
        '-AdefaultObfuscationEnv=searge',
    ]
    options.encoding = 'UTF-8'
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'MixinConfigs'            : mixinConfig,
        ])
    }
    // Shade SeedFinding
    from {
        configurations.runtimeClasspath.findAll { it.name.contains('mc_feature') }.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
}
